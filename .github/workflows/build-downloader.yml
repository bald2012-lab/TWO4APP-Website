name: Build TWO4APP Downloader APK
on:
  push:
    branches: [main]
    paths:
      - 'android-downloader/**'
      - '.github/workflows/build-downloader.yml'
  pull_request:
    paths:
      - 'android-downloader/**'
      - '.github/workflows/build-downloader.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android platform
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)
          echo "Using $SDKMANAGER"
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"
      - name: Build signed testing APK
        working-directory: android-downloader
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Verify APK signature
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose android-downloader/app/build/outputs/apk/debug/app-debug.apk
          sha256sum android-downloader/app/build/outputs/apk/debug/app-debug.apk
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: TWO4APP-Downloader-1.0
          path: android-downloader/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
