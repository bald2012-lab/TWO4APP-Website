name: Build TWO4APP Downloader APK
on:
  workflow_dispatch:
    inputs:
      publish_test_apk:
        description: Publish the tested APK to Releases
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: two4app-release-publication
  cancel-in-progress: false

jobs:
  build-android:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android platform
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)
          echo "Using $SDKMANAGER"
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"
      - name: Build signed testing APK
        working-directory: android-downloader
        run: gradle :app:testDebugUnitTest :app:assembleDebug --no-daemon --stacktrace
      - name: Verify APK signature
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose android-downloader/app/build/outputs/apk/debug/app-debug.apk
          sha256sum android-downloader/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish tested APK to GitHub Releases
        if: inputs.publish_test_apk
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          apk=android-downloader/app/build/outputs/apk/debug/app-debug.apk
          build_tools="$ANDROID_HOME/build-tools/35.0.0"
          badging=$("$build_tools/aapt2" dump badging "$apk")
          version=$(sed -nE "s/^package: .* versionName='([^']+)'.*/\1/p" <<< "$badging")
          code=$(sed -nE "s/^package: .* versionCode='([^']+)'.*/\1/p" <<< "$badging")
          tag="downloader-$version-test"
          python3 .github/two4app/release_storage.py --registry .github/two4app/protected-versions.json publish --repo "$GITHUB_REPOSITORY" --version "$version" --version-code "$code" --commit "$GITHUB_SHA" --tag "$tag" --app 'TWO4APP Downloader' --package de.two4app.downloader --asset-name "downloader-tv-$version.apk" --apk "$apk" --build-tools "$build_tools" --notes "Tests and build: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID."
