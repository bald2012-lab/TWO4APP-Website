name: Build TWO4APP Downloader APK
on:
  push:
    branches: [main]
    paths:
      - 'android-downloader/**'
      - '.github/workflows/build-downloader.yml'
  pull_request:
    paths:
      - 'android-downloader/**'
      - '.github/workflows/build-downloader.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build signed testing APK
        working-directory: android-downloader
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: TWO4APP-Downloader-1.0
          path: android-downloader/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publish direct download to GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          cp android-downloader/app/build/outputs/apk/debug/app-debug.apk downloader.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloader.apk
          if ! git diff --cached --quiet; then
            git commit -m "Publish TWO4APP Downloader 1.0 testing APK"
            git push origin HEAD:main
          fi
