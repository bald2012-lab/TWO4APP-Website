plugins { id 'com.android.application' }

android {
    namespace 'de.two4app.downloader'
    compileSdk 35
    defaultConfig {
        applicationId 'de.two4app.downloader'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '1.1'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        debug { minifyEnabled false }
        release { minifyEnabled false }
    }
}
